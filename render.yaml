services:
  - type: web
    name: flappy-ws
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    # Not: healthCheckPath yok — Render TCP kontrolü yapar.
    # serve.py PORT env'ini WS_PORT olarak kullanır (SERVE_HTTP=false).
    envVars:
      - key: SERVE_HTTP
        value: false
      - key: PYTHON_VERSION
        value: 3.12.0
